# The spill pass (run_tpch_safe.sh, SPILL_STATS_DIR): Spark's default console log
# plus INFO from the RAPIDS spill and OOM loggers. These survive the runner's
# setLogLevel("WARN"), which only changes the root logger, so the driver log keeps
# DeviceMemoryEventHandler's "Device store spilled N bytes" (eventlog_stats.py).
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
logger.devmem.name = com.nvidia.spark.rapids.DeviceMemoryEventHandler
logger.devmem.level = info
logger.hoststore.name = com.nvidia.spark.rapids.spill.SpillableHostStore
logger.hoststore.level = info
logger.hostalloc.name = com.nvidia.spark.rapids.HostAlloc
logger.hostalloc.level = info
